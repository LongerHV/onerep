version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - noctx
    - unconvert
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/LongerHV/onerep
